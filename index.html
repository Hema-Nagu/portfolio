<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hemalatha N | Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Modern Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0f172a;
        }

        ::-webkit-scrollbar-thumb {
            background: #3b82f6;
            border-radius: 10px;
        }
        #galaxy {
            position: fixed;  
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;      
        }
        .content {
            position: relative;
            z-index: 1; 
        }

    </style>

</head>

<body class="bg-slate-950 text-slate-200 font-sans">
    <canvas id="galaxy"></canvas>

    <div class="content">

        <!-- Navigation -->
        <nav class="fixed w-full z-50 bg-slate-900/80 backdrop-blur">
            <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
                <div class="text-2xl font-bold tracking-tighter text-blue-500">HEMA<span class="text-white">.DEV</span>
                </div>
                <div class="hidden md:flex space-x-8 items-center font-medium">
                    <a href="index.html" class="hover:text-blue-400">Home</a>
                    <a href="experience.html" class="hover:text-blue-400">Experience</a>
                    <a href="skills.html" class="hover:text-blue-400">Skills</a>
                    <a href="contact.html" class="hover:text-blue-400">Contact</a>
                    <a href="Hemalatha_CppDeveloper.pdf" download
                        class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-full flex items-center shadow-lg shadow-blue-900/40 transition">
                        <i class="fas fa-file-download mr-2"></i> Resume
                    </a>
                </div>
            </div>
        </nav>

        <!-- Home Section -->
        <section class="min-h-screen flex flex-col justify-center items-center pt-24">
            <div class="text-center">
                <img src="Profile.jpg" alt="Hemalatha N"
                    class="w-44 h-44 rounded-full border-4 border-blue-500 mx-auto mb-6">
                <h1 class="text-5xl font-black text-white">Hemalatha N</h1>
                <p class="text-xl text-blue-400 mb-6">Senior Software Engineer | C++ & Embedded Systems</p>
            </div>

        </section>

        <footer class="py-12 text-center text-slate-600 border-t border-slate-900">
            <p>© 2026 Hemalatha N. All Rights Reserved.</p>
        </footer>
    </div>

    <script>
        const canvas = document.getElementById("galaxy");
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let stars = [];
        for (let i = 0; i < 200; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 1.5,
                speed: Math.random() * 0.5 + 0.2
            });
        }

        function drawStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "white";
            stars.forEach(star => {
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fill();
                star.y += star.speed;
                if (star.y > canvas.height) star.y = 0;
            });
            requestAnimationFrame(drawStars);
        }

        drawStars();
    </script>

</body>

</html>
